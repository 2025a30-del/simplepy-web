<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimplePy Web</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
    }
    .topbar {
      background: #1fc76a;
      color: #fff;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 18px;
    }
    .wrap {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }
    .main {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
      margin-top: 16px;
    }
    textarea {
      width: 100%;
      min-height: 340px;
      border: none;
      resize: vertical;
      padding: 16px;
      font-size: 18px;
      line-height: 1.5;
      font-family: "Courier New", monospace;
      background: #fff;
    }
    .side {
      padding: 16px;
      background: #fafafa;
      border-left: 1px solid #ddd;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    button {
      border: none;
      background: #1fc76a;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #e8e8e8;
      color: #111;
    }
    .console {
      background: #111;
      color: #eee;
      border-radius: 8px;
      min-height: 200px;
      padding: 12px;
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
      line-height: 1.5;
      overflow: auto;
    }
    .help {
      margin-top: 12px;
      font-size: 14px;
      color: #444;
      line-height: 1.6;
    }
    .code {
      font-family: "Courier New", monospace;
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
    }
    @media (max-width: 800px) {
      .main { grid-template-columns: 1fr; }
      textarea { min-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="topbar">SimplePy Web — very simple</div>

  <div class="wrap">
    <div class="buttons">
      <button id="runBtn">Run</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>

    <div class="main panel">
      <div>
        <textarea id="editor">say: Hello, world!
say: My name is Alex
say: I am learning Python</textarea>
      </div>

      <div class="side">
        <div>Output</div>
        <div id="console" class="console">Ready.</div>
      </div>
    </div>

    <div class="help">
      Type lines like:<br>
      <span class="code">say: Hello</span><br>
      <span class="code">say: My name is Alex</span><br>
      <span class="code">ask: What is your name?</span><br>
      Press <strong>Run</strong>.
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const consoleEl = document.getElementById('console');
    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');

    function runSimpleCode() {
      const raw = editor.value;
      const lines = raw.split('\n');
      const output = [];

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        const sayMatch = trimmed.match(/^say\s*:\s*(.*)$/i);
        if (sayMatch) {
          output.push(sayMatch[1]);
          continue;
        }

        const askMatch = trimmed.match(/^ask\s*:\s*(.*)$/i);
        if (askMatch) {
          const prompt = askMatch[1] || '';
          const answer = prompt ? window.prompt(prompt) : window.prompt('');
          output.push(answer ?? '');
          continue;
        }

        output.push('// skipped: ' + trimmed);
      }

      consoleEl.textContent = output.join('\n');
    }

    runBtn.addEventListener('click', runSimpleCode);
    clearBtn.addEventListener('click', () => {
      consoleEl.textContent = 'Ready.';
    });

    editor.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        runSimpleCode();
      }
    });
  </script>
</body>
</html>
